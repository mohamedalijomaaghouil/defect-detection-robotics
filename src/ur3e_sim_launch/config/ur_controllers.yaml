controller_manager:
  ros__parameters:
    update_rate: 10  # This can be an integer
    
    controller_manager_timeout: 120.0

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: True

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # FIX: Must be doubles (add .0)
    state_publish_rate: 5.0 
    action_monitor_rate: 10.0
    allow_partial_joints_goal: false
    constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.02
